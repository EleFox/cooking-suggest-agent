# cooking-web-service 前端 Nginx 站点配置
# - SPA：非静态资源请求回退到 index.html（React Router 前端路由）
# - /api：反向代理到 compose 网络内的 web-backend 服务

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 菜谱详情等请求体可能较大，放宽上传限制。
    client_max_body_size 10m;

    # 静态资源（Vite 产物带内容哈希，可长期缓存）。
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Docker 内置 DNS；用变量 + resolver 延迟解析，避免 web-backend
        # 未就绪时 Nginx 因解析失败而拒绝启动。
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $web_backend http://web-backend:8000;
        proxy_pass $web_backend;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 决策链路最长可达 AGENT_SERVICE_TIMEOUT（默认 600s），同步放宽超时。
        proxy_connect_timeout 10s;
        proxy_send_timeout 660s;
        proxy_read_timeout 660s;

        # 决策为长耗时流式等待，关闭缓冲避免请求被中断。
        proxy_buffering off;
    }
}
